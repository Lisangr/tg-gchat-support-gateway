name: CD - Deploy Gateway

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare directories on Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /opt/support-gateway/secrets /opt/support-gateway/data

      - name: Copy project files to Host
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          overwrite: true
          source: "src,Dockerfile,docker-compose.yml,requirements.txt"
          target: "/opt/support-gateway"

      - name: Write secrets & start container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/support-gateway

            cat <<'SA_EOF' > secrets/google-sa.json
            ${{ secrets.GOOGLE_SA_KEY_JSON }}
            SA_EOF
            chmod 600 secrets/google-sa.json

            cat <<EOF > .env
            TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}
            TG_CHAT_ID=${{ secrets.TG_CHAT_ID }}
            GCHAT_SPACE_ID=${{ secrets.GCHAT_SPACE_ID }}
            PUBSUB_SUBSCRIPTION=${{ secrets.PUBSUB_SUBSCRIPTION }}
            EOF
            chmod 600 .env

            docker compose up -d --build