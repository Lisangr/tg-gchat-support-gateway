name: CD - Deploy Gateway

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (e.g. latest or sha-xxxxxxx)"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare target directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /opt/support-gateway/secrets /opt/support-gateway/data

      - name: Copy docker-compose.yml to host
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/support-gateway/"

      - name: Pull GHCR image and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/support-gateway

            umask 077
            cat <<'EOF_SA' > secrets/google-sa.json
            ${{ secrets.GOOGLE_SA_KEY_JSON }}
            EOF_SA

            cat <<'EOF_ENV' > .env
            TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}
            GCHAT_SPACE_ID=${{ secrets.GCHAT_SPACE_ID }}
            TG_CHAT_ID=${{ secrets.TG_CHAT_ID }}
            ROUTING_MODE=${{ secrets.ROUTING_MODE }}
            PUBSUB_SUBSCRIPTION=${{ secrets.PUBSUB_SUBSCRIPTION }}
            EOF_ENV

            chmod 700 secrets
            chmod 644 secrets/google-sa.json
            chmod 600 .env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export IMAGE_NAME="ghcr.io/${{ github.repository }}"
            export IMAGE_TAG="${{ inputs.image_tag }}"

            docker compose pull
            docker compose up -d --no-build --remove-orphans
            docker image prune -f
            