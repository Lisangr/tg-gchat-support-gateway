services:
  gateway:
    image: ${IMAGE_NAME:-ghcr.io/local/tg-gchat-support-gateway}:${IMAGE_TAG:-latest}
    build: .
    container_name: support-gateway
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/google-sa.json
      - DB_PATH=/app/data/gateway.db
      - METRICS_PORT=9090
    volumes:
      - ./secrets/google-sa.json:/app/secrets/google-sa.json:ro
      - gateway_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/healthz', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  gateway_data: